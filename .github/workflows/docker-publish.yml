name: Build and Publish Docker Image

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a versioned image or promote an existing version to latest
        type: choice
        options:
          - publish
          - promote
        default: publish
        required: true
      version:
        description: CLI Git tag in vX.Y.Z format
        type: string
        required: true

concurrency:
  group: fab-inspector-container-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/natvang/fab-inspector

jobs:
  publish-or-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        id: release
        env:
          VERSION_TAG: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch and select the release with the version input."
            exit 1
          fi
          if [[ "$OPERATION" != publish && "$OPERATION" != promote ]]; then
            echo "::error::Operation must be publish or promote."
            exit 1
          fi
          if [[ ! "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be a CLI Git tag in vX.Y.Z format."
            exit 1
          fi
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout CLI release tag
        if: inputs.operation == 'publish'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check versioned image
        id: image
        env:
          VERSION_TAG: ${{ steps.release.outputs.tag }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          ref="$IMAGE:$VERSION_TAG"
          if result=$(docker buildx imagetools inspect --format '{{println .Manifest.Digest}}' "$ref" 2>&1); then
            if [[ "$OPERATION" == publish ]]; then
              echo "::error::$ref already exists. Version tags are not overwritten."
              exit 1
            fi
            if [[ ! "$result" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not determine the digest of $ref."
              exit 1
            fi
            echo "digest=$result" >> "$GITHUB_OUTPUT"
          elif [[ "$result" == "ERROR: $ref: not found" ]]; then
            if [[ "$OPERATION" == promote ]]; then
              echo "::error::$ref is not published. Publish it before promoting it."
              exit 1
            fi
          else
            printf '%s\n' "$result" >&2
            echo "::error::Could not check $ref in GHCR."
            exit 1
          fi

      - name: Build and publish versioned image
        if: inputs.operation == 'publish'
        env:
          VERSION_TAG: ${{ steps.release.outputs.tag }}
          CLI_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          dockerfile=FabInspector.CLI/Dockerfile
          if ! grep -Eq '^ARG CLI_VERSION(=|$)' "$dockerfile"; then
            echo "::error::$VERSION_TAG predates versioned image support. Choose a tag with CLI_VERSION support."
            exit 1
          fi
          docker buildx build --push \
            --file "$dockerfile" \
            --build-arg "CLI_VERSION=$CLI_VERSION" \
            --label "org.opencontainers.image.version=$VERSION_TAG" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --tag "$IMAGE:$VERSION_TAG" .

      - name: Promote published image to latest
        if: inputs.operation == 'promote'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          actual=$(docker buildx imagetools inspect --format '{{println .Manifest.Digest}}' "$IMAGE:latest")
          if [[ "$actual" != "$DIGEST" ]]; then
            echo "::error::latest resolved to $actual instead of $DIGEST."
            exit 1
          fi